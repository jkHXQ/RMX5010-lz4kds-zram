<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<title>LZ4KDS</title>
<style>
  :root {
    --bg: #070a0e;
    --card: rgba(22, 28, 36, .92);
    --line: rgba(255, 255, 255, .07);
    --text: #eef3f8;
    --dim: #7f8b9b;
    --accent: #4c9aff;
    --accent2: #7c5cff;
    --ok: #35d07f;
    --warn: #e3b341;
    --bad: #ff5f56;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    padding: 18px 16px 36px;
    background:
      radial-gradient(1200px 420px at 100% -10%, rgba(124, 92, 255, .18), transparent 60%),
      radial-gradient(900px 380px at -20% 0%, rgba(76, 154, 255, .15), transparent 55%),
      var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, "PingFang SC", sans-serif;
    min-height: 100vh;
  }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  .brand span { background: linear-gradient(90deg, #4c9aff, #7c5cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--dim); font-size: 12px; margin: 2px 0 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px; margin-bottom: 12px; backdrop-filter: blur(10px);
  }
  .label { color: var(--dim); font-size: 11px; letter-spacing: .4px; text-transform: uppercase; }
  .hero-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .big { font-size: 34px; font-weight: 700; letter-spacing: -1px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .big small { font-size: 13px; font-weight: 500; color: var(--dim); margin-left: 4px; }
  .pill {
    padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: rgba(76, 154, 255, .14); color: #9cc4ff; border: 1px solid rgba(76, 154, 255, .25);
  }
  .bar { height: 7px; border-radius: 99px; background: rgba(255,255,255,.07); margin: 16px 0 8px; overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #4c9aff, #7c5cff); transition: width .4s ease; }
  .bar-label { display: flex; justify-content: space-between; color: var(--dim); font-size: 11.5px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .metric {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px;
  }
  .m-label { color: var(--dim); font-size: 11px; }
  .m-val { font-size: 19px; font-weight: 650; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .m-sub { color: var(--dim); font-size: 10px; margin-top: 1px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; font-size: 13px; }
  .row + .row { border-top: 1px solid var(--line); }
  .badge { padding: 3px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 600; }
  .badge.ok { background: rgba(53, 208, 127, .13); color: #5fe3a1; }
  .badge.warn { background: rgba(227, 179, 65, .13); color: #e8c266; }
  .badge.bad { background: rgba(255, 95, 86, .13); color: #ff8a84; }
  .note { color: var(--dim); font-size: 11px; margin: -4px 0 6px; }
  .input-wrap { position: relative; margin: 8px 0 10px; }
  .input-wrap input {
    width: 100%; padding: 13px 54px 13px 14px; border-radius: 13px;
    border: 1px solid var(--line); background: rgba(0,0,0,.35); color: var(--text);
    font-size: 17px; font-weight: 600; outline: none; font-variant-numeric: tabular-nums;
  }
  .input-wrap input:focus { border-color: rgba(76,154,255,.6); box-shadow: 0 0 0 3px rgba(76,154,255,.12); }
  .unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--dim); font-size: 12px; }
  .chips { display: flex; gap: 8px; margin-bottom: 14px; }
  .chip {
    flex: 1; padding: 8px 0; border-radius: 11px; background: rgba(255,255,255,.05);
    border: 1px solid var(--line); color: var(--dim); font-size: 12px;
  }
  .chip:active { background: rgba(76,154,255,.15); color: #9cc4ff; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 16px; }
  .seg button {
    padding: 9px 0; border-radius: 11px; font-size: 12px; font-weight: 600;
    background: rgba(255,255,255,.04); border: 1px solid var(--line); color: var(--dim);
  }
  .seg button.on {
    background: linear-gradient(135deg, rgba(76,154,255,.22), rgba(124,92,255,.22));
    border-color: rgba(124,92,255,.45); color: #cbd9ff;
  }
  .hidden-select { display: none; }
  .actions { display: grid; gap: 10px; }
  .btn { padding: 13px 0; border-radius: 13px; border: 1px solid var(--line); font-size: 14px; font-weight: 650; }
  .btn.primary {
    border: 0; color: #fff;
    background: linear-gradient(135deg, #4c9aff, #7c5cff);
    box-shadow: 0 8px 24px rgba(76, 130, 255, .28);
  }
  .btn:disabled { opacity: .45; box-shadow: none; }
  pre {
    background: rgba(0,0,0,.4); border: 1px solid var(--line); border-radius: 13px;
    padding: 11px; margin: 0; font-size: 11.5px; color: var(--dim);
    white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow: auto;
  }
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .top-actions { display: flex; gap: 8px; flex: 0 0 auto; }
  .theme-btn {
    position: relative;
    flex: 0 0 auto; width: 34px; height: 34px; padding: 0;
    border-radius: 11px; border: 1px solid var(--line);
    background: rgba(255, 255, 255, .06);
    display: grid; place-items: center;
  }
  .theme-btn svg { width: 18px; height: 18px; display: none; }
  body[data-mode="auto"] .theme-btn .i-gear,
  body[data-mode="light"] .theme-btn .i-sun,
  body[data-mode="dark"] .theme-btn .i-moon { display: block; }
  .theme-btn .gear {
    stroke-width: 1.1; transform-origin: 50% 50%; transform-box: fill-box;
    animation: spin 12s linear infinite;
    transition: fill .2s ease, stroke .2s ease;
  }
  .theme-btn:active .gear { animation-duration: 1.6s; }
  body.theme-dark .theme-btn .gear { fill: #0b0f14; stroke: #cfd8e3; }
  body.theme-light .theme-btn .gear { fill: #ffffff; stroke: #1b2430; }
  body[data-mode="auto"] .theme-btn .gear { fill: url(#gearAuto); stroke: #9aa6b4; }
  .theme-btn .sun { fill: #e3b341; }
  .theme-btn .moon { fill: #9cc4ff; }
  body.theme-light .theme-btn .sun { fill: #d99a00; }
  body.theme-light .theme-btn .moon { fill: #475569; }
  .loading {
    position: fixed; inset: 0; z-index: 120; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    background: rgba(0, 0, 0, .45); backdrop-filter: blur(3px);
    color: var(--text); font-size: 13px;
  }
  .loading.show { display: flex; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, .18); border-top-color: #4c9aff;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  body.theme-light .loading { background: rgba(255, 255, 255, .6); }
  body.theme-light .spinner { border-color: rgba(15, 25, 40, .12); border-top-color: #2563eb; }
  /* 手动主题：默认深色，可切浅色 */
  body.theme-dark { --text: #d5dde6; }
  body.theme-light {
    --bg: #eef2f7;
    --card: #ffffff;
    --line: rgba(15, 25, 40, .10);
    --text: #1b2430;
    --dim: #5f6b7a;
    background:
      radial-gradient(900px 360px at 100% -10%, rgba(124, 92, 255, .10), transparent 60%),
      radial-gradient(800px 320px at -20% 0%, rgba(76, 154, 255, .10), transparent 55%),
      var(--bg);
  }
  body.theme-light .pill { background: rgba(37, 99, 235, .10); color: #1d4ed8; border-color: rgba(37, 99, 235, .30); }
  body.theme-light .bar { background: rgba(15, 25, 40, .08); }
  body.theme-light .input-wrap input { background: #f7f9fc; }
  body.theme-light .seg button, body.theme-light .chip { background: rgba(15, 25, 40, .05); }
  body.theme-light .seg button { color: #475569; }
  body.theme-light .seg button.on {
    background: rgba(37, 99, 235, .14);
    border-color: rgba(37, 99, 235, .45);
    color: #1d4ed8;
  }
  body.theme-light .chip { color: #475569; }
  body.theme-light .theme-btn { color: #475569; }
  body.theme-light pre { background: #f7f9fc; color: #4a5563; }
  body.theme-light .badge.ok { background: rgba(23, 148, 90, .12); color: #12764a; }
  body.theme-light .badge.warn { background: rgba(168, 115, 10, .12); color: #8a5f08; }
  body.theme-light .theme-btn { background: rgba(15, 25, 40, .05); }
</style>
</head>
<body>

  <div>
    <div class="brand">LZ4KDS <span>内存压缩</span></div>

      </svg>
    </button>

</div>

<section class="card">
  <div class="hero-top">
    <div>
      <div class="label">运行容量</div>
      <div class="big" id="ds">-</div>
    </div>
    <span class="pill" id="comp">-</span>
  </div>
  <div class="bar"><div class="fill" id="swapbar"></div></div>
  <div class="bar-label">
    <span id="swap">-</span>
    <span id="swapPct">-</span>
  </div>
</section>

<section class="grid">
  <div class="metric">
    <div class="m-label">相同页复用</div>
    <div class="m-val" id="alias">-</div>
    <div class="m-sub">alias，相同内容只存一份</div>
  </div>
  <div class="metric">
    <div class="m-label">相似页增量</div>
    <div class="m-val" id="delta">-</div>

  <div class="metric">
    <div class="m-label">当前节省</div>
    <div class="m-val" id="saved">-</div>
    <div class="m-sub">此刻存活对象省下的内存</div>
  </div>
  <div class="metric">
    <div class="m-label">累计节省</div>
    <div class="m-val" id="savedtotal">-</div>
    <div class="m-sub">开机以来累计，不回落</div>
  </div>
</section>

<section class="card">
  <div class="row">
    <span>SDDC 相似页压缩</span>
    <span class="badge warn" id="sddc">-</span>
  </div>
  <div class="note" id="sddcdesc">仅在算法为 lz4kds 时启用</div>
  <div class="row">
    <span>读回解码失败</span><span id="dec">-</span>
  </div>
  <div class="row">
    <span>开机自检</span><span id="self">-</span>
  </div>
  <div class="row">
    <span>配置容量</span><span id="cfgsize">-</span>
  </div>
</section>

<section class="card">
  <div class="label">容量（MiB，填多少就是多少）</div>
  <div class="input-wrap">
    <input id="size" type="number" min="512" max="65536" step="512" inputmode="numeric" placeholder="例如 9216">
    <span class="unit">MiB</span>
  </div>
  <div class="chips">
    <button class="chip" onclick="setSize(8192)">8 GB</button>
    <button class="chip" onclick="setSize(16384)">16 GB</button>
    <button class="chip" onclick="setSize(24576)">24 GB</button>
  </div>

  <div class="label">压缩算法</div>
  <select id="algo" class="hidden-select">
    <option value="lz4kds">lz4kds</option>

    <option value="lzo">lzo</option>

  <div class="seg" id="segAlgo">
    <button data-v="lz4kds">lz4kds</button>
    <button data-v="lz4kd">lz4kd</button>
    <button data-v="lzo">lzo</button>
    <button data-v="lzo-rle">lzo-rle</button>
    <button data-v="lz4">lz4</button>
    <button data-v="zstd">zstd</button>
    <button data-v="zstdn">zstdn</button>
    <button data-v="zstdn_o">zstdn_o</button>
  </div>

    <button class="btn primary" onclick="apply()">立即应用</button>
  </div>

</section>

<section class="card"><pre id="log">就绪</pre></section>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div id="loadingText">正在应用…</div>
</div>

<script>
const MOD = '/data/adb/modules/lz4kds';
let formFilled = false;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function waitKsu() {
  for (let i = 0; i < 100; i++) {
    if (typeof ksu !== 'undefined' && ksu.exec) return true;
    await sleep(100);
  }
  return false;
}

function exec(cmd) {
  return new Promise((resolve, reject) => {
    const cb = 'kcb_' + Math.floor(Math.random() * 1e9);
    window[cb] = (errno, stdout, stderr) => {
      delete window[cb];
      resolve({ errno, stdout: stdout || '', stderr: stderr || '' });
    };
    try { ksu.exec(cmd, '{}', cb); } catch (e) { reject(e); }
  });
}

const log = t => $('log').textContent = t;

let themeMode = 'auto';

function resolveTheme(mode) {
  if (mode === 'light' || mode === 'dark') return mode;
  return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}

function applyTheme(mode) {
  themeMode = mode;
  const t = resolveTheme(mode);
  document.body.classList.remove('theme-light', 'theme-dark');
  document.body.classList.add('theme-' + t);
  document.body.dataset.mode = mode;
  const b = $('themeBtn');
  if (b) b.title = '主题：' + (mode === 'auto' ? '自动（跟随系统）' : mode === 'light' ? '浅色' : '深色');
  try { localStorage.setItem('kds-theme', mode); } catch (e) {}
}

function cycleTheme() {
  const order = ['auto', 'light', 'dark'];
  applyTheme(order[(order.indexOf(themeMode) + 1) % order.length]);
}

matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
  if (themeMode === 'auto') applyTheme('auto');
});

function setSize(v) { $('size').value = v; }

function markSeg(value) {
  document.querySelectorAll('#segAlgo button').forEach(b => {
    b.classList.toggle('on', b.dataset.v === value);
  });
}

document.querySelectorAll('#segAlgo button').forEach(b => {
  b.addEventListener('click', () => {
    $('algo').value = b.dataset.v;
    markSeg(b.dataset.v);
  });
});

function mb(bytes) {
  const n = Number(bytes || 0);
  return n ? (n / 1048576).toFixed(1) + '<small> MiB</small>' : '0<small> MiB</small>';
}

function mbFromKB(kb) {
  const n = Number(kb || 0);
  return n ? (n / 1024).toFixed(0) + ' MiB' : '0 MiB';
}

function selfState(v) {
  if (v === '' || v === undefined || v === null) return 'skip';
  const n = Number(v);
  /* 只有初值 -1 表示“本次开机未运行”，其它负数都是真实错误码 */
  if (!Number.isFinite(n) || n === -1) return 'skip';
  return n === 0 ? 'ok' : 'bad';
}

function selfLabel(v) {
  const s = selfState(v);
  if (s === 'ok') return '通过';
  if (s === 'bad') return '失败（' + v + '）';
  return '未运行';
}

async function refresh() {
  const r = await exec(`sh ${MOD}/webroot/webui.sh status`);
  const m = {};
  r.stdout.split('\n').forEach(line => {
    const i = line.indexOf('=');
    if (i > 0) m[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  });
  if (!m.disksize) { log('读取状态失败：\n' + (r.stderr || r.stdout)); return; }

  $('ds').innerHTML = mb(m.disksize);
  $('comp').textContent = m.comp || '-';
  $('cfgsize').textContent = m.cfg_size ? m.cfg_size + ' MiB' : '厂商默认';

  const used = Number(m.swap_used || 0), total = Number(m.swap_total || 0);
  const pct = total ? Math.min(100, used / total * 100) : 0;
  $('swapbar').style.width = pct.toFixed(1) + '%';
  $('swap').textContent = 'swap ' + mbFromKB(used) + ' / ' + mbFromKB(total);
  $('swapPct').textContent = pct.toFixed(0) + '%';

  const en = m.enabled === '1';
  const s = $('sddc'), sd = $('sddcdesc');
  s.textContent = en ? '已启用' : '未启用';
  s.className = 'badge ' + (en ? 'ok' : 'warn');
  if (en) {
    sd.textContent = '已启用：相同页复用 + 相似页增量压缩';
  } else if (m.comp === 'lz4kds') {
    sd.textContent = '算法是 lz4kds，但 SDDC 管理器未建立（元数据分配失败）。dmesg | grep -i sddc 可看原因，降低容量后重启即可重试';
  } else {
    sd.textContent = '当前算法 ' + (m.comp || '-') + ' 不支持相似页压缩，只有 lz4kds 支持';
  }

  $('alias').textContent = (m.aliases || 0) + ' 页';
  $('delta').textContent = (m.deltas || 0) + ' 页';
  $('saved').innerHTML = mb(m.saved);
  $('savedtotal').innerHTML = mb(m.saved_total);

  const d = Number(m.decode_fail || 0);
  const de = $('dec');
  de.textContent = d + ' 次';
  de.style.color = d ? 'var(--bad)' : 'var(--ok)';

  const se = $('self');
  /* 自检只对 lz4kds 有意义：换了其它算法时不再报“失败/未运行”，直接标为不适用 */
  if (m.comp !== 'lz4kds') {
    se.textContent = '当前算法 ' + (m.comp || '-') + ' 无需自检';
    se.style.color = 'var(--dim)';
  } else {
    const cs = selfState(m.codec), rs = selfState(m.io);
    se.textContent = '压缩 ' + selfLabel(m.codec) + ' · 读写 ' + selfLabel(m.io);
    se.style.color = (cs === 'bad' || rs === 'bad') ? 'var(--bad)'
      : (cs === 'ok' && rs === 'ok') ? 'var(--ok)' : 'var(--dim)';
  }

  if (m.cfg_size && m.disksize &&
      Math.round(Number(m.disksize) / 1048576) !== Number(m.cfg_size)) {
    $('cfgsize').style.color = 'var(--warn)';
  } else {
    $('cfgsize').style.color = '';
  }

  if (!formFilled) {
    if (m.cfg_size) $('size').value = m.cfg_size;
    if (m.cfg_algo) { $('algo').value = m.cfg_algo; markSeg(m.cfg_algo); }
    formFilled = true;
  }
}

function validForm() {
  const size = $('size').value.trim();
  const algo = $('algo').value;
  if (!/^\d+$/.test(size) || +size < 512 || +size > 65536) {
    log('容量需要 512 - 65536 之间的整数');
    return null;
  }
  return { size, algo };
}

async function apply() {
  const v = validForm();
  if (!v) return;
  const btns = document.querySelectorAll('button');
  btns.forEach(b => b.disabled = true);
  $('loadingText').textContent = '正在应用…';
  $('loading').classList.add('show');
  await sleep(80);
  log('执行中 ...');
  try {
    const r = await exec(`sh ${MOD}/webroot/webui.sh apply ${v.size} ${v.algo} 1`);
    log(r.stdout + (r.stderr ? '\n' + r.stderr : ''));
    formFilled = false;
    await refresh();
  } catch (e) {
    log('执行失败：' + e.message);
  } finally {
    $('loading').classList.remove('show');
    btns.forEach(b => b.disabled = false);
  }
}

(async () => {
  let saved = null;
  try { saved = localStorage.getItem('kds-theme'); } catch (e) {}
  applyTheme(['auto', 'light', 'dark'].includes(saved) ? saved : 'auto');

  if (!await waitKsu()) {
    log('KernelSU WebUI 接口不可用；请从 KernelSU Manager 的模块页面打开本界面。');
    return;
  }
  await refresh();
  setInterval(refresh, 10000);
})();
</script>
</body>
</html>
